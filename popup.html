<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="mainView">

    <h1>Inspirational Quote Generator</h1>

    <button id="generate">Generate Quote</button>
    <button id="goToFavorites">View Favorites</button>

    <div id="quoteCard">
      <p id="quote"></p>
      <p id="author"></p>

      <div class="quoteActions">
        <button id="favoriteBtn">Favorite</button>
      </div>
    </div>

  </div>

  <div id="favoritesView" style="display:none">

    <h1>Favorites</h1>

    <button id="back">Back</button>

    <div id="favoritesList"></div>

  </div>

  <script src="popup.js"></script>

</body>
</html>
